name: Build CHelper packages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ make cmake dpkg-dev \
            libxxhash-dev libutfcpp-dev

      - name: 下载 rapidjson (master)
        run: |
          git clone --depth 1 https://github.com/Tencent/rapidjson.git
          ls rapidjson/include/rapidjson/document.h

      - name: 编译 fmt 10.2.1
        run: |
          curl -sL -o fmt.tar.gz https://github.com/fmtlib/fmt/archive/refs/tags/11.1.4.tar.gz
          tar xzf fmt.tar.gz
          cmake -S fmt-11.1.4 -B fmt-build -DCMAKE_BUILD_TYPE=Release -DFMT_TEST=OFF -DFMT_DOC=OFF -DCMAKE_INSTALL_PREFIX=$PWD/fmt-install
          cmake --build fmt-build -j2
          cmake --install fmt-build
          ls -la fmt-install/lib/libfmt.a fmt-install/lib/cmake/fmt/

      - name: 编译 spdlog (v1.x, 外部 fmt)
        run: |
          curl -sL -o spdlog.tar.gz https://github.com/gabime/spdlog/archive/refs/tags/v1.15.3.tar.gz
          tar xzf spdlog.tar.gz
          cmake -S spdlog-1.15.3 -B spdlog-build -DCMAKE_BUILD_TYPE=Release \
            -DSPDLOG_FMT_EXTERNAL=ON -DSPDLOG_BUILD_EXAMPLE=OFF \
            -DSPDLOG_BUILD_TESTS=OFF -DSPDLOG_BUILD_BENCH=OFF -DCMAKE_CXX_FLAGS="-I$PWD/fmt-11.1.4/include" \
            -Dfmt_DIR=$PWD/fmt-install/lib/cmake/fmt
          cmake --build spdlog-build -j2
          ls -la spdlog-build/libspdlog.a

      - name: 编译 CHelper 内核与 CLI
        run: |
          mkdir -p build
          g++ -std=c++20 -O2 -D_GNU_SOURCE \
            -Iinclude -Ibuild-include -Isrc -I/usr/include/utf8cpp -Iserialization-include \
            -Irapidjson/include -Ifmt-11.1.4/include -Ispdlog-1.15.3/include \
            $(find src/chelper -name '*.cpp' | sort) src/main.cpp \
            -o build/chelper \
            spdlog-build/libspdlog.a fmt-build/libfmt.a \
            /usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/libxxhash.a \
            -pthread
          file build/chelper

      - name: 打包 deb
        run: |
          set -e
          PKG=build/chelper-cli_0.2.0-1_${{ matrix.arch }}
          mkdir -p $PKG/DEBIAN \
                   $PKG/usr/bin \
                   $PKG/usr/share/chelper \
                   $PKG/usr/share/doc/chelper-cli
          cp build/chelper $PKG/usr/bin/chelper
          cp resources/*.cpack $PKG/usr/share/chelper/
          cp resources/blockFixData.json $PKG/usr/share/chelper/
          cat > $PKG/DEBIAN/control <<EOF
          Package: chelper-cli
          Version: 0.2.0-1
          Section: games
          Priority: optional
          Architecture: ${{ matrix.arch }}
          Maintainer: olo-qwp <olo-qwp@users.noreply.github.com>
          Installed-Size: $(du -sk $PKG/usr | cut -f1)
          Depends: libc6 (>= 2.31)
          Description: 我的世界基岩版命令辅助器（命令行版）
           基于 CHelper 开源内核 (GPLv3) 的命令辅助工具。
           提供命令补全、语法检查、命令结构展示、旧语法转新语法等功能。
           Homepage: https://github.com/Yancey2023/CHelper
          EOF
          cat > $PKG/usr/share/doc/chelper-cli/copyright <<EOF
          chelper-cli 0.1.0
          Copyright (C) 2026 Yancey (CHelper), chelper-cli contributors

          本程序基于 CHelper 内核构建：
            https://github.com/Yancey2023/CHelper
          CHelper 以 GPLv3 协议开源。本程序同样以 GPLv3 协议发布。
          EOF
          dpkg-deb --build --root-owner-group $PKG
          ls -lh build/*.deb

      - name: 上传 deb 产物
        uses: actions/upload-artifact@v4
        with:
          name: chelper-cli-${{ matrix.arch }}
          path: build/*.deb
          if-no-files-found: error

  macho:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载源码依赖 (fmt/spdlog/xxhash/utfcpp/rapidjson)
        run: |
          curl -sL -o fmt.tar.gz https://github.com/fmtlib/fmt/archive/refs/tags/11.1.4.tar.gz
          tar xzf fmt.tar.gz
          curl -sL -o spdlog.tar.gz https://github.com/gabime/spdlog/archive/refs/tags/v1.15.3.tar.gz
          tar xzf spdlog.tar.gz
          curl -sL -o xxhash.tar.gz https://github.com/Cyan4973/xxHash/archive/refs/heads/release.tar.gz
          tar xzf xxhash.tar.gz
          curl -sL -o utfcpp.tar.gz https://github.com/nemtrif/utfcpp/archive/refs/heads/master.tar.gz
          tar xzf utfcpp.tar.gz
          git clone --depth 1 https://github.com/Tencent/rapidjson.git
          ls -d fmt-11.1.4 spdlog-1.15.3 xxHash-release utfcpp-master rapidjson

      - name: 交叉编译 fmt (iOS arm64)
        run: |
          cmake -S fmt-11.1.4 -B fmt-ios -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_BUILD_TYPE=Release -DFMT_TEST=OFF -DFMT_DOC=OFF
          cmake --build fmt-ios -j3
          ls -la fmt-ios/libfmt.a

      - name: 交叉编译 spdlog (iOS arm64, 外部 fmt)
        run: |
          cmake -S spdlog-1.15.3 -B spdlog-ios -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_BUILD_TYPE=Release -DSPDLOG_FMT_EXTERNAL=ON \
            -DSPDLOG_BUILD_EXAMPLE=OFF -DSPDLOG_BUILD_TESTS=OFF -DSPDLOG_BUILD_BENCH=OFF -DCMAKE_CXX_FLAGS="-I$PWD/fmt-11.1.4/include" \
            -Dfmt_DIR=$PWD/fmt-ios
          cmake --build spdlog-ios -j3
          ls -la spdlog-ios/libspdlog.a

      - name: 编译 xxhash (iOS arm64)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -c -O2 -target arm64-apple-ios13.0 -isysroot $SDK xxHash-release/xxhash.c -o xxhash-ios.o

      - name: 编译 CHelper (iOS arm64 Mach-O)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build
          clang++ -std=c++20 -O2 -UFMT_ENFORCE_COMPILE_STRING -target arm64-apple-ios13.0 -isysroot $SDK \
            -Iinclude -Ibuild-include -Isrc -Irapidjson/include \
            -Ifmt-11.1.4/include -Ispdlog-1.15.3/include -Iutfcpp-master/source -IxxHash-release \
            -Iserialization-include \
            $(find src/chelper -name '*.cpp' | sort) src/main.cpp \
            spdlog-ios/libspdlog.a fmt-ios/libfmt.a xxhash-ios.o \
            -lc++ -o build/chelper-ios
          codesign -s - build/chelper-ios
          file build/chelper-ios
          lipo -info build/chelper-ios

      - name: 编译 fmt/spdlog (macOS native)
        run: |
          cmake -S fmt-11.1.4 -B fmt-macos -DCMAKE_BUILD_TYPE=Release -DFMT_TEST=OFF -DFMT_DOC=OFF
          cmake --build fmt-macos -j3
          cmake -S spdlog-1.15.3 -B spdlog-macos -DCMAKE_BUILD_TYPE=Release \
            -DSPDLOG_FMT_EXTERNAL=ON -DSPDLOG_BUILD_EXAMPLE=OFF \
            -DSPDLOG_BUILD_TESTS=OFF -DSPDLOG_BUILD_BENCH=OFF -DCMAKE_CXX_FLAGS="-I$PWD/fmt-11.1.4/include" \
            -Dfmt_DIR=$PWD/fmt-macos
          cmake --build spdlog-macos -j3
          ls -la fmt-macos/libfmt.a spdlog-macos/libspdlog.a

      - name: 编译 xxhash (macOS arm64)
        run: |
          clang -c -O2 xxHash-release/xxhash.c -o xxhash-macos.o

      - name: 编译 CHelper (macOS arm64 Mach-O)
        run: |
          mkdir -p build
          clang++ -std=c++20 -O2 -UFMT_ENFORCE_COMPILE_STRING \
            -Iinclude -Ibuild-include -Isrc -Irapidjson/include \
            -Ifmt-11.1.4/include -Ispdlog-1.15.3/include -Iutfcpp-master/source -IxxHash-release \
            -Iserialization-include \
            $(find src/chelper -name '*.cpp' | sort) src/main.cpp \
            spdlog-macos/libspdlog.a fmt-macos/libfmt.a xxhash-macos.o \
            -lc++ -o build/chelper-macos
          file build/chelper-macos

      - name: 编译 CHelperTweak.dylib (iOS 悬浮窗插件)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -std=c++20 -O2 -fobjc-arc -dynamiclib \
            -target arm64-apple-ios13.0 -isysroot $SDK \
            -Iinclude -Ibuild-include -Isrc -Irapidjson/include \
            -Ifmt-11.1.4/include -Ispdlog-1.15.3/include -Iutfcpp-master/source -IxxHash-release \
            -Iserialization-include \
            $(find src/chelper -name '*.cpp' | sort) tweak/CHelperTweak.mm \
            spdlog-ios/libspdlog.a fmt-ios/libfmt.a xxhash-ios.o \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -o build/CHelperTweak.dylib
          codesign -s - build/CHelperTweak.dylib
          file build/CHelperTweak.dylib

      - name: 打包越狱 deb (iphoneos-arm64, tweak)
        run: |
          set -e
          which dpkg-deb >/dev/null 2>&1 || brew install dpkg >/dev/null 2>&1
          PKG=build/chelper-cli_0.3.0-1_iphoneos-arm64
          mkdir -p $PKG/DEBIAN \
                   $PKG/usr/bin $PKG/usr/share/chelper $PKG/usr/share/doc/chelper-cli \
                   $PKG/DynamicLibraries \
                   $PKG/Library/MobileSubstrate/DynamicLibraries
          cp build/chelper-ios $PKG/usr/bin/chelper
          chmod 755 $PKG/usr/bin/chelper
          cp resources/*.cpack resources/blockFixData.json $PKG/usr/share/chelper/
          # tweak 插件（标准布局 + 根目录双保险）
          cp build/CHelperTweak.dylib $PKG/DynamicLibraries/
          cp tweak/CHelperTweak.plist $PKG/DynamicLibraries/
          cp build/CHelperTweak.dylib $PKG/Library/MobileSubstrate/DynamicLibraries/
          cp tweak/CHelperTweak.plist $PKG/Library/MobileSubstrate/DynamicLibraries/
          cat > $PKG/DEBIAN/control <<EOF
          Package: com.chelper.cli
          Version: 0.3.0-1
          Section: Games
          Priority: optional
          Architecture: iphoneos-arm64
          Maintainer: olo-qwp <olo-qwp@users.noreply.github.com>
          Installed-Size: $(du -sk $PKG/usr | cut -f1)
          Depends: firmware (>= 13.0), mobilesubstrate (>= 0.9.5000)
          Description: 我的世界基岩版命令辅助器（游戏内悬浮窗）
           基于 CHelper 开源内核 (GPLv3)。
           游戏内悬浮球 + 命令输入面板：实时补全、语法提示、
           一键复制到聊天框。附命令行版 chelper。
           Homepage: https://github.com/Yancey2023/CHelper
          EOF
          cat > $PKG/usr/share/doc/chelper-cli/copyright <<EOF
          chelper-cli 0.3.0
          Copyright (C) 2026 Yancey (CHelper), chelper-cli contributors
          基于 CHelper 内核 (GPLv3): https://github.com/Yancey2023/CHelper
          EOF
          dpkg-deb -Zgzip --build --root-owner-group $PKG
          ls -lh build/*.deb

      - name: 上传 Mach-O 产物
        uses: actions/upload-artifact@v4
        with:
          name: chelper-macho
          path: |
            build/chelper-ios
            build/chelper-macos
            build/*.deb
          if-no-files-found: error
