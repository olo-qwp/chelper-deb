name: Build CHelper deb

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ make dpkg-dev \
            libfmt-dev libspdlog-dev libxxhash-dev rapidjson-dev libutf8cpp-dev

      - name: 编译 CHelper 内核与 CLI（静态链接 fmt/spdlog/xxhash）
        run: |
          mkdir -p build
          g++ -std=c++20 -O2 -D_GNU_SOURCE \
            -Iinclude -Ibuild-include -Isrc -I/usr/include/utf8cpp -Iserialization-include \
            $(find src/chelper -name '*.cpp' | sort) src/main.cpp \
            -o build/chelper \
            -Wl,--start-group \
            /usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/libspdlog.a \
            /usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/libfmt.a \
            /usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/libxxhash.a \
            -Wl,--end-group -pthread
          file build/chelper

      - name: 打包 deb
        run: |
          set -e
          PKG=build/chelper-cli_0.1.0-1_${{ matrix.arch }}
          mkdir -p $PKG/DEBIAN \
                   $PKG/usr/bin \
                   $PKG/usr/share/chelper \
                   $PKG/usr/share/doc/chelper-cli
          cp build/chelper $PKG/usr/bin/chelper
          cp resources/*.cpack $PKG/usr/share/chelper/
          cp resources/blockFixData.json $PKG/usr/share/chelper/
          cat > $PKG/DEBIAN/control <<EOF
          Package: chelper-cli
          Version: 0.1.0-1
          Section: games
          Priority: optional
          Architecture: ${{ matrix.arch }}
          Maintainer: olo-qwp <olo-qwp@users.noreply.github.com>
          Installed-Size: $(du -sk $PKG/usr | cut -f1)
          Depends: libc6 (>= 2.31)
          Description: 我的世界基岩版命令辅助器（命令行版）
           基于 CHelper 开源内核 (GPLv3) 的命令辅助工具。
           提供命令补全、语法检查、命令结构展示、旧语法转新语法等功能。
           Homepage: https://github.com/Yancey2023/CHelper
          EOF
          cat > $PKG/usr/share/doc/chelper-cli/copyright <<EOF
          chelper-cli 0.1.0
          Copyright (C) 2026 Yancey (CHelper), chelper-cli contributors

          本程序基于 CHelper 内核构建：
            https://github.com/Yancey2023/CHelper
          CHelper 以 GPLv3 协议开源。本程序同样以 GPLv3 协议发布。
          EOF
          dpkg-deb --build --root-owner-group $PKG
          ls -lh build/*.deb

      - name: 上传 deb 产物
        uses: actions/upload-artifact@v4
        with:
          name: chelper-cli-${{ matrix.arch }}
          path: build/*.deb
          if-no-files-found: error

      - name: 发布 Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: chelper-cli v0.1.0
          files: build/*.deb
          generate_release_notes: true
